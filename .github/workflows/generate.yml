name: Regenerate Java OpenAPI Client

on:
  repository_dispatch:
    types: [spec_tagged, spec_updated]
  workflow_dispatch:
    inputs:
      spec_tag:
        description: 'Tag or branch in xyo-financial/specs to generate from'
        required: false
        default: 'main'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout SDK repository
        uses: actions/checkout@v4

      - name: Checkout OpenAPI specification
        uses: actions/checkout@v4
        with:
          repository: xyo-financial/specs
          ref: ${{ github.event.client_payload.tag || inputs.spec_tag || 'main' }}
          path: specs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate OpenAPI Java client
        run: |
          npx -y @openapitools/openapi-generator-cli generate \
            -i specs/openapi.yml \
            -g java \
            -o openapi \
            --additional-properties=groupId=io.github.xyo-financial,artifactId=xyo-openapi,artifactVersion=2.0.1,library=native,invokerPackage=financial.xyo.client,apiPackage=financial.xyo.api,modelPackage=financial.xyo.model \
            --global-property apiTests=false,modelTests=false,apiDocs=false,modelDocs=false

          # Remove generator noise and scaffolding files
          rm -f openapi/git_push.sh \
                openapi/.travis.yml \
                openapi/build.gradle \
                openapi/build.sbt \
                openapi/gradle.properties \
                openapi/gradlew \
                openapi/gradlew.bat \
                openapi/settings.gradle \
                openapi/README.md \
                openapi/src/main/AndroidManifest.xml
          rm -rf openapi/.github \
                 openapi/gradle \
                 openapi/docs \
                 openapi/api

          # Clean up specs checkout so it is not committed
          rm -rf specs

      - name: Install generated client to local Maven cache
        run: mvn clean install -q -DskipTests --file openapi/pom.xml

      - name: Build and test Java SDK wrapper
        run: |
          mvn clean compile -q --file xyo-sdk/pom.xml
          mvn test -B --file xyo-sdk/pom.xml

      - name: Commit regenerated client
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate OpenAPI client from spec ${{ github.event.client_payload.tag || inputs.spec_tag || 'latest' }}"
          file_pattern: "openapi/**"

